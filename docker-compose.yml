services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: audiobook-backend
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  services:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: audiobook-services
    command: uvicorn src.services.main:app --host 0.0.0.0 --port 8100 --reload
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: audiobook-frontend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    working_dir: /app
    env_file:
      - .env
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: audiobook-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audiobook}
      POSTGRES_USER: ${POSTGRES_USER:-audiobook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiobook}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: audiobook-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
